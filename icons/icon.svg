<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="100%" style="stop-color:#2A5298"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- 네트워크 점선 장식 (연결 노드) -->
  <g clip-path="url(#round)" opacity="0.12">
    <circle cx="80"  cy="80"  r="18" fill="#fff"/>
    <circle cx="430" cy="80"  r="14" fill="#fff"/>
    <circle cx="80"  cy="432" r="14" fill="#fff"/>
    <circle cx="432" cy="430" r="18" fill="#fff"/>
    <circle cx="256" cy="60"  r="10" fill="#fff"/>
    <circle cx="60"  cy="256" r="10" fill="#fff"/>
    <circle cx="452" cy="256" r="10" fill="#fff"/>
    <circle cx="256" cy="452" r="10" fill="#fff"/>
    <line x1="80"  y1="80"  x2="256" y2="60"  stroke="#fff" stroke-width="2"/>
    <line x1="256" y1="60"  x2="430" y2="80"  stroke="#fff" stroke-width="2"/>
    <line x1="430" y1="80"  x2="452" y2="256" stroke="#fff" stroke-width="2"/>
    <line x1="452" y1="256" x2="432" y2="430" stroke="#fff" stroke-width="2"/>
    <line x1="432" y1="430" x2="256" y2="452" stroke="#fff" stroke-width="2"/>
    <line x1="256" y1="452" x2="80"  y2="432" stroke="#fff" stroke-width="2"/>
    <line x1="80"  y1="432" x2="60"  y2="256" stroke="#fff" stroke-width="2"/>
    <line x1="60"  y1="256" x2="80"  y2="80"  stroke="#fff" stroke-width="2"/>
  </g>

  <!-- 메인 텍스트 ECLADO -->
  <text
    x="256" y="288"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="108"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-2"
  >ECLADO</text>

  <!-- 하단 브랜드 텍스트 Co -->
  <text
    x="256" y="378"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="96"
    font-weight="700"
    fill="rgba(255,255,255,0.55)"
    text-anchor="middle"
    letter-spacing="2"
  >Co</text>
</svg>
